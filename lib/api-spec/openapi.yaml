openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: thermalshift
    description: ThermalShift cold-storage optimization prototype
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health:
    get:
      operationId: getThermalShiftHealth
      tags: [thermalshift]
      summary: Check the ThermalShift optimization service
      responses:
        "200":
          description: ThermalShift service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThermalShiftHealth"
  /demo:
    get:
      operationId: getThermalShiftDemo
      tags: [thermalshift]
      summary: Retrieve the clearly labeled synthetic demo scenario
      responses:
        "200":
          description: 24-hour demo scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThermalShiftScenario"
  /optimize:
    post:
      operationId: optimizeThermalShift
      tags: [thermalshift]
      summary: Optimize a 24-hour cooling schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThermalShiftOptimizeInput"
      responses:
        "200":
          description: Optimization result or infeasible schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThermalShiftReport"
        "422":
          description: Invalid scenario data
  /compare-scenarios:
    post:
      operationId: compareThermalShiftScenarios
      tags: [thermalshift]
      summary: Compare baseline, cost-optimized, and carbon-aware cooling schedules
      description: Uses the supplied tariff and grid-intensity arrays as separate objectives. All optimized schedules preserve baseline energy and use the same hourly cooling and temperature constraints; results are illustrative model estimates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThermalShiftOptimizeInput"
      responses:
        "200":
          description: Three scenario schedules with metrics and per-scenario feasibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThermalShiftScenarioComparison"
        "422":
          description: Invalid scenario data
  /verify-hash:
    post:
      operationId: verifyThermalShiftReportHash
      tags: [thermalshift]
      summary: Verify a report's local SHA-256 evidence hash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThermalShiftHashInput"
      responses:
        "200":
          description: Hash comparison result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThermalShiftHashResult"
        "422":
          description: Missing report or report hash
  /import-csv:
    post:
      operationId: importThermalShiftCsv
      tags: [thermalshift]
      summary: Validate and import a 24-hour scenario CSV
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThermalShiftCsvImportInput"
      responses:
        "200":
          description: Validated scenario built from 24 hourly CSV records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThermalShiftCsvImportResult"
        "422":
          description: Invalid CSV schema, values, or hourly records
  /anchor/status:
    get:
      operationId: getThermalShiftAnchorStatus
      tags: [thermalshift]
      summary: Check testnet anchoring configuration without returning credentials
      responses:
        "200":
          description: Sepolia readiness and missing configuration names
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThermalShiftAnchorStatus"
  /anchor/report/{report_hash}:
    get:
      operationId: getThermalShiftAnchorByReportHash
      tags: [thermalshift]
      summary: Retrieve the stored anchor record for a canonical report hash
      parameters:
        - name: report_hash
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-f0-9]{64}$"
      responses:
        "200":
          description: Stored Sepolia transaction record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThermalShiftAnchorRecord"
        "404":
          description: No anchor record exists for this hash
  /anchor:
    post:
      operationId: anchorThermalShiftReport
      tags: [thermalshift]
      summary: Anchor the canonical SHA-256 report hash on Ethereum Sepolia
      description: Creates a zero-value self-transfer with the report hash as transaction calldata. The result is not proof of input authenticity, model validity, or real-world savings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThermalShiftAnchorInput"
      responses:
        "200":
          description: Submitted, pending, confirmed, or explicitly unresolved transaction status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThermalShiftAnchorRecord"
        "409":
          description: Supplied report hash does not match canonical report content
        "422":
          description: Invalid report or hash
        "502":
          description: Sepolia RPC is unavailable or rejected the request before submission
        "503":
          description: Anchoring is disabled or missing required server configuration
  /anchor/verify:
    post:
      operationId: verifyThermalShiftAnchor
      tags: [thermalshift]
      summary: Verify an anchor against the current report and Sepolia transaction data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThermalShiftAnchorVerifyInput"
      responses:
        "200":
          description: On-chain field comparison and confirmation status; valid is null while unresolved or pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThermalShiftAnchorVerification"
        "404":
          description: No locally stored record exists for this transaction hash
        "422":
          description: Invalid report or transaction hash
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ThermalShiftHealth:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        version:
          type: string
      required: [status, service, version]
    ThermalShiftScenario:
      type: object
      properties:
        name:
          type: string
        input_provenance:
          type: string
          enum: [synthetic_demo, user_supplied_unverified]
          default: user_supplied_unverified
          description: Caller-supplied label only; the API does not authenticate source records.
        tariff_metadata:
          $ref: "#/components/schemas/ThermalShiftHourlySeriesMetadata"
        grid_emissions_metadata:
          $ref: "#/components/schemas/ThermalShiftHourlySeriesMetadata"
        baseline_kwh:
          type: array
          minItems: 24
          maxItems: 24
          items: { type: number, minimum: 0 }
        tariff_per_kwh:
          type: array
          minItems: 24
          maxItems: 24
          items: { type: number, minimum: 0 }
        grid_kgco2_per_kwh:
          type: array
          minItems: 24
          maxItems: 24
          items: { type: number, minimum: 0 }
        ambient_heat_gain_c:
          type: array
          minItems: 24
          maxItems: 24
          items: { type: number, minimum: 0 }
        initial_temp_c:
          type: number
        min_temp_c:
          type: number
        max_temp_c:
          type: number
        cooling_effect_c_per_kwh:
          type: number
        max_cooling_kwh_per_hour:
          type: number
        cost_weight:
          type: number
        carbon_weight:
          type: number
      required:
        - name
        - tariff_metadata
        - grid_emissions_metadata
        - baseline_kwh
        - tariff_per_kwh
        - grid_kgco2_per_kwh
        - ambient_heat_gain_c
    ThermalShiftOptimizeInput:
      type: object
      properties:
        scenario:
          $ref: "#/components/schemas/ThermalShiftScenario"
      required: [scenario]
    ThermalShiftReport:
      type: object
      properties:
        feasible:
          type: boolean
        model_output_classification:
          type: string
          enum: [illustrative_model_estimate]
        input_provenance:
          type: string
          enum: [synthetic_demo, user_supplied_unverified]
        model_notice:
          type: string
        objective_notice:
          type: string
        data_notice:
          type: string
        provenance_notice:
          type: string
        evaluation_notice:
          type: string
        time_series_metadata:
          $ref: "#/components/schemas/ThermalShiftReportTimeSeriesMetadata"
        energy_budget_kwh:
          type: number
        baseline:
          type: object
          additionalProperties: true
        optimized:
          type: object
          additionalProperties: true
        change_pct:
          type: object
          additionalProperties: true
        temperature_check:
          type: object
          additionalProperties: true
        hourly:
          type: array
          items:
            $ref: "#/components/schemas/ThermalShiftHourlyReport"
        evidence:
          $ref: "#/components/schemas/ThermalShiftEvidence"
      additionalProperties: true
    ThermalShiftScenarioComparison:
      type: object
      properties:
        scenario:
          type: string
        model_output_classification:
          type: string
          enum: [illustrative_model_estimate]
        input_provenance:
          type: string
          enum: [synthetic_demo, user_supplied_unverified]
        time_series_metadata:
          $ref: "#/components/schemas/ThermalShiftReportTimeSeriesMetadata"
        objective_functions:
          type: object
          properties:
            baseline: { type: string }
            cost_optimized: { type: string }
            carbon_aware: { type: string }
          required: [baseline, cost_optimized, carbon_aware]
        constraints:
          type: object
          properties:
            energy_budget_kwh: { type: number }
            energy_budget_rule: { type: string }
            min_temp_c: { type: number }
            max_temp_c: { type: number }
            max_cooling_kwh_per_hour: { type: number }
            temperature_model: { type: string }
          required:
            - energy_budget_kwh
            - energy_budget_rule
            - min_temp_c
            - max_temp_c
            - max_cooling_kwh_per_hour
            - temperature_model
        model_notice:
          type: string
        scenarios:
          type: object
          properties:
            baseline:
              $ref: "#/components/schemas/ThermalShiftComparisonScenario"
            cost_optimized:
              $ref: "#/components/schemas/ThermalShiftComparisonScenario"
            carbon_aware:
              $ref: "#/components/schemas/ThermalShiftComparisonScenario"
          required: [baseline, cost_optimized, carbon_aware]
      required:
        - scenario
        - model_output_classification
        - input_provenance
        - time_series_metadata
        - objective_functions
        - constraints
        - model_notice
        - scenarios
    ThermalShiftComparisonScenario:
      type: object
      properties:
        feasible:
          type: boolean
        metrics:
          oneOf:
            - $ref: "#/components/schemas/ThermalShiftComparisonMetrics"
            - type: "null"
        hourly:
          type: array
          items:
            $ref: "#/components/schemas/ThermalShiftComparisonHourly"
        warnings:
          type: array
          items: { type: string }
        solver_message:
          type: [string, "null"]
      required: [feasible, metrics, hourly, warnings, solver_message]
    ThermalShiftComparisonMetrics:
      type: object
      properties:
        energy_kwh: { type: number }
        electricity_cost: { type: number }
        electricity_cost_unit: { type: string }
        modeled_emissions_kgco2: { type: number }
        peak_hourly_cooling_kwh: { type: number }
        peak_kw_proxy: { type: number }
      required:
        - energy_kwh
        - electricity_cost
        - electricity_cost_unit
        - modeled_emissions_kgco2
        - peak_hourly_cooling_kwh
        - peak_kw_proxy
    ThermalShiftComparisonHourly:
      type: object
      properties:
        hour: { type: integer, minimum: 0, maximum: 23 }
        timestamp: { type: string, format: date-time }
        cooling_kwh: { type: number }
        modeled_temperature_c: { type: number }
        tariff_per_kwh: { type: number }
        grid_kgco2_per_kwh: { type: number }
      required:
        - hour
        - timestamp
        - cooling_kwh
        - modeled_temperature_c
        - tariff_per_kwh
        - grid_kgco2_per_kwh
    ThermalShiftEvidence:
      type: object
      properties:
        algorithm:
          type: string
          enum: [SHA-256]
        report_hash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        status:
          type: string
        scope:
          type: string
      required: [algorithm, report_hash, status, scope]
    ThermalShiftHashInput:
      type: object
      properties:
        report:
          type: object
          additionalProperties: true
        report_hash:
          type: string
          minLength: 1
      required: [report, report_hash]
    ThermalShiftHashResult:
      type: object
      properties:
        valid:
          type: boolean
        calculated_hash:
          type: string
        provided_hash:
          type: string
        note:
          type: string
      required: [valid, calculated_hash, provided_hash, note]
    ThermalShiftAnchorStatus:
      type: object
      properties:
        network:
          type: string
        chain_id:
          type: integer
        explorer_base_url:
          type: string
          format: uri
        enabled:
          type: boolean
        configured:
          type: boolean
        ready:
          type: boolean
        network_available:
          type: [boolean, "null"]
        wallet_address:
          type: [string, "null"]
        wallet_balance_wei:
          type: [string, "null"]
        confirmations_required:
          type: integer
        missing_configuration:
          type: array
          items:
            type: string
        configuration_error:
          type: [string, "null"]
        status_error:
          type: [string, "null"]
        notice:
          type: string
      required:
        - network
        - chain_id
        - explorer_base_url
        - enabled
        - configured
        - ready
        - network_available
        - wallet_address
        - wallet_balance_wei
        - confirmations_required
        - missing_configuration
        - configuration_error
        - status_error
        - notice
    ThermalShiftAnchorInput:
      type: object
      properties:
        report:
          type: object
          additionalProperties: true
        report_hash:
          type: string
          pattern: "^[a-f0-9]{64}$"
      required: [report, report_hash]
    ThermalShiftAnchorVerifyInput:
      type: object
      properties:
        report:
          type: object
          additionalProperties: true
        transaction_hash:
          type: string
          pattern: "^0x[a-fA-F0-9]{64}$"
      required: [report, transaction_hash]
    ThermalShiftAnchorRecord:
      type: object
      properties:
        network:
          type: string
        chain_id:
          type: integer
        report_hash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        transaction_hash:
          type: string
          pattern: "^0x[a-fA-F0-9]{64}$"
        signer_address:
          type: string
        destination_address:
          type: string
        status:
          type: string
          enum: [prepared, submitted, pending, confirmed, submission_unknown, rejected, failed, mismatch]
        confirmations:
          type: integer
          minimum: 0
        confirmations_required:
          type: integer
          minimum: 1
        block_number:
          type: [integer, "null"]
        explorer_url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_error:
          type: [string, "null"]
      required:
        - network
        - chain_id
        - report_hash
        - transaction_hash
        - signer_address
        - destination_address
        - status
        - confirmations
        - confirmations_required
        - block_number
        - explorer_url
        - created_at
        - updated_at
        - last_error
    ThermalShiftAnchorVerification:
      allOf:
        - $ref: "#/components/schemas/ThermalShiftAnchorRecord"
        - type: object
          properties:
            valid:
              type: [boolean, "null"]
            report_matches:
              type: boolean
            on_chain_transaction_matches:
              type: [boolean, "null"]
            verification_error:
              type: [string, "null"]
            note:
              type: string
          required:
            - valid
            - report_matches
            - on_chain_transaction_matches
            - verification_error
            - note
    ThermalShiftCsvImportInput:
      type: object
      properties:
        csv_text:
          type: string
          minLength: 1
          maxLength: 100000
        metadata:
          $ref: "#/components/schemas/ThermalShiftCsvImportMetadata"
        scenario:
          $ref: "#/components/schemas/ThermalShiftScenario"
      required: [csv_text, metadata]
    ThermalShiftCsvImportResult:
      type: object
      properties:
        scenario:
          $ref: "#/components/schemas/ThermalShiftScenario"
        record_count:
          type: integer
        headers:
          type: array
          items:
            type: string
      required: [scenario, record_count, headers]
    ThermalShiftHourlySeriesMetadata:
      type: object
      properties:
        timestamps:
          type: array
          minItems: 24
          maxItems: 24
          items:
            type: string
            format: date-time
          description: ISO 8601 interval starts with explicit offsets; exactly 24 consecutive hourly timestamps.
        timezone:
          type: string
          minLength: 1
          description: IANA time-zone identifier used to validate the supplied timestamp offsets.
        unit:
          type: string
          minLength: 1
        source:
          type: string
          minLength: 1
          maxLength: 500
          description: Caller-supplied source name or URL; not independently authenticated.
      required: [timestamps, timezone, unit, source]
    ThermalShiftCsvImportMetadata:
      type: object
      properties:
        timezone:
          type: string
          minLength: 1
        tariff_unit:
          type: string
          pattern: "^[A-Z]{3}/kWh$"
          description: ISO currency code per kWh, for example INR/kWh or EUR/kWh.
        tariff_source:
          type: string
          minLength: 1
          maxLength: 500
        grid_emissions_unit:
          type: string
          enum: [kgCO2/kWh]
        grid_emissions_source:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - timezone
        - tariff_unit
        - tariff_source
        - grid_emissions_unit
        - grid_emissions_source
    ThermalShiftReportTimeSeriesMetadata:
      type: object
      properties:
        timezone:
          type: string
        tariff_unit:
          type: string
        tariff_source:
          type: string
        grid_emissions_unit:
          type: string
        grid_emissions_source:
          type: string
        interval_count:
          type: integer
          enum: [24]
        first_interval_start:
          type: string
          format: date-time
        last_interval_start:
          type: string
          format: date-time
        source_metadata_notice:
          type: string
      required:
        - timezone
        - tariff_unit
        - tariff_source
        - grid_emissions_unit
        - grid_emissions_source
        - interval_count
        - first_interval_start
        - last_interval_start
        - source_metadata_notice
    ThermalShiftHourlyReport:
      type: object
      properties:
        hour:
          type: integer
          minimum: 0
          maximum: 23
        timestamp:
          type: string
          format: date-time
        tariff_timestamp:
          type: string
          format: date-time
        grid_emissions_timestamp:
          type: string
          format: date-time
        baseline_kwh:
          type: number
        optimized_kwh:
          type: number
        tariff:
          type: number
        grid_kgco2_per_kwh:
          type: number
        baseline_temp_c:
          type: number
        optimized_temp_c:
          type: number
      required:
        - hour
        - timestamp
        - tariff_timestamp
        - grid_emissions_timestamp
        - baseline_kwh
        - optimized_kwh
        - tariff
        - grid_kgco2_per_kwh
        - baseline_temp_c
        - optimized_temp_c

